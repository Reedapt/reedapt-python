name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # PyPI trusted publishing: no token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the version
        run: test "v$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^"]*' src/reedapt/_version.py)" = "${GITHUB_REF_NAME}"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
